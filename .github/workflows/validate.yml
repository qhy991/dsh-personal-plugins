name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the pinned DSH test toolchain
        id: dsh-source
        run: >-
          python3 -c 'import json, os, pathlib;
          value=json.loads(pathlib.Path("plugins/dsh-mirror.json").read_text());
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write(
          "node=" + value["toolchain"]["node"] + "\n")'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.dsh-source.outputs.node }}

      - run: python3 scripts/check.py
